<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Windows App Icon Background: Fluent Rounded Rect -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" filter="url(#shadow)"/>
  
  <!-- Subtle Windows Acrylic Grid Lines -->
  <path d="M24 160 H488 M24 352 H488 M160 24 V488 M352 24 V488" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  
  <!-- Pulse / Ultrasound wave line -->
  <path d="M80 270 L170 270 L195 210 L230 330 L260 230 L285 290 L320 270 L432 270" 
        fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Mother & Fetus / Baby Heart Symbolism -->
  <g transform="translate(156, 110)">
    <!-- Mother figure silhouette -->
    <path d="M100 20 C140 20 170 50 170 90 C170 125 150 155 125 180 C155 190 190 220 190 260 C190 310 145 350 95 350 C45 350 10 310 10 260 C10 220 45 190 75 180 C50 155 30 125 30 90 C30 50 60 20 100 20 Z" 
          fill="url(#heart-grad)" opacity="0.95" filter="url(#shadow)"/>
          
    <!-- Glowing Ultrasound Core / Baby inside womb -->
    <circle cx="100" cy="260" r="45" fill="#f43f5e" opacity="0.9"/>
    <path d="M85 255 C85 240 100 235 110 245 C120 255 115 270 100 280 C90 270 85 265 85 255 Z" fill="#ffffff"/>
    <circle cx="107" cy="245" r="7" fill="#ffffff"/>

    <!-- Small Cross / Medical Caduceus marker -->
    <g transform="translate(145, 45)">
      <circle cx="20" cy="20" r="24" fill="#0284c7"/>
      <rect x="16" y="8" width="8" height="24" rx="3" fill="#ffffff"/>
      <rect x="8" y="16" width="24" height="8" rx="3" fill="#ffffff"/>
    </g>
  </g>
</svg>
